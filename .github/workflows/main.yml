name: Deploy Jupyter Book

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install jupyter-book ghp-import
    
    - name: Build the book
      run: |
        jupyter-book build .
    
    - name: Deploy to GitHub Pages
      run: |
        ghp-import -n -p -f -c ykoutelidakis.github.io/CV _build/html
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
